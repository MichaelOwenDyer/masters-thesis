[package]
name = "petrivet-testkit"
version = "0.1.0"
edition = "2024"
description = "Instance and candidate-target proposer for the petrivet thesis evaluation (no authority over truth)"
publish = false

[dependencies]
petrivet = { git = "https://github.com/MichaelOwenDyer/petrivet", branch = "main", features = ["pnml"] }
rand = { version = "=0.9.2", default-features = false, features = ["std"] }
rand_chacha = "=0.9.0"
blake3 = "=1.8.2"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
