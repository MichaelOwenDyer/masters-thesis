[package]
name = "petrivet-eval"
version = "0.1.0"
edition = "2024"
description = "Evaluation pipeline for the petrivet thesis"
publish = false

[dependencies]
petrivet = { git = "https://github.com/MichaelOwenDyer/petrivet", branch = "main" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.9"
rand_chacha = "0.9"
blake3 = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
