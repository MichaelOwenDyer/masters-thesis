# All parameters of the evaluation pipeline. Relative paths are resolved against the directory of this file.
# The --config flag of petrivet-eval may override the path of this file only.

[paths]
# MCC 2026 oracle verdict files, one directory per model (<ModelId>/<ModelId>-<EXAM>.out); filled by `petrivet-eval oracle`.
oracle_dir = "corpus/mcc/oracle"
# Optional: MCC 2025 archive, read only to compare model files (never a download source). Absent or missing file:
# the comparison is skipped and the values recorded in selected.json are kept. Example: "/path/to/oracle.zip"
# oracle_2025_zip = ""
# Output directory of the MCC stage (selection.json, selected.json, histogram.json, models/).
corpus_dir = "corpus/mcc"

[select]
seed = 20261022
# mcc-small: definite state count at most this
small_max_states = 1000000
# number of alternative models kept per family in each ranked candidate list (fallbacks if one is too large or not readable by petrivet)
models_per_candidate = 5
# mcc-small drawing rule (applied by `fetch`, deterministic). A model counts as drawn only if petrivet parses it
# (connected, ordinary), it is not colored, and (large only) its PNML is within the size cap.
# Per family the candidates are ordered by distance of their state-count rank from the family median
# (median first, then the nearest neighbours alternately, lower before upper). Families are visited in the order
# of blake3(seed || family).
# Pass 1: per family the first parsing candidate (at most 1 per family; all pass-1 models are kept even if they
#   exceed the target).
# Pass 2 (only if pass 1 yields fewer than small_target): per family, in the same order, the next parsing candidate
#   among the remaining ones, until small_target is reached or the pool is exhausted.
# The quality bar is never lowered; if the target is not reached the shortfall is reported.
small_target = 90

[fetch]
# MCC oracle verdict archive (cached as <corpus_dir>/oracle.tar.gz)
oracle_url = "https://yanntm.github.io/pnmcc-models-2026/oracle.tar.gz"
base_url = "https://yanntm.github.io/pnmcc-models-2026/INPUTS"
# mcc-large models per examination (a family counts once across examinations)
quota_per_exam = 5
# mcc-large candidates with a larger model.pnml are skipped
max_pnml_bytes = 5000000
curl_max_time_secs = 180

[run]
# Campaign B (subprocess runs). Relative results_dir is resolved against the directory of this file.
results_dir = "results"
# external wall-clock cap per run, the process group is killed on expiry (TIMEOUT)
wall_cap_secs = 30
# campaign A (correctness, `run --campaign A`): safety wall cap per run in seconds (not a measurement)
a_wall_cap_secs = 30
# memory limit per run (MEMOUT when exceeded and detectable)
mem_limit_gib = 8
# at most this many jobs at the same time
parallel_jobs = 3
# one core per running job is taken from this list (worker i gets cores[i]); empty: no pinning. On the Linux box
# use separate physical cores whose hyper-thread siblings stay idle (check `lscpu -e`: on the i7-4790K box CPUs n and n+4
# are siblings, so use [0, 1, 2] and leave 3-7 to the system).
cores = [0, 1, 2]
# memory limiter: "auto" (cgroup v2 via systemd-run --user --scope if it works, else setrlimit address space on
# Linux, else none), "cgroup", "rlimit" or "none"
mem_limiter = "auto"
# bytes of stdout and stderr kept per run, in KiB
out_cap_kib = 1024
# campaign C (timeout sweep, `run --campaign C`): internal timeouts t in ms given to pv-dispatch as --timeout-ms.
# Cells of B whose unconstrained pv-dispatch run took more than 2 x the largest t are run once per t (3 repetitions
# if the first run is under 1 s).
c_timeouts_ms = [10, 100, 1000]
# shuffle seed; if absent [select] seed is used
# seed = 20261022

[solvers.pv]
# petrivet CLI; looked up on PATH. The environment variable PETRIVET_BIN overrides it (local testing).
command = "petrivet"

[solvers.lola]
# LoLA 2.0; looked up on PATH. The environment variable LOLA_BIN overrides it.
command = "lola"

[solvers.ndrio]
# TINA's net converter, used for PNML to LoLA (`ndrio -PNML -lola`). The environment variable NDRIO_BIN overrides it.
command = "ndrio"

[solvers.tina]
# TINA 4.0.0 programs (TINA_BIN, SIFT_BIN, SCAN_BIN override).
tina = "tina"
sift = "sift"
scan = "scan"

[latency]
# Campaign D (`petrivet-eval latency <gen manifest>`): sequences of back-to-back calls on small gen nets.
# calls per (variant, query, instance) sequence
sequence = 200
# instances per generator class
per_class = 20
# size_bucket of the gen manifest that counts as small (the testkit names buckets by place range: 2-5, 6-8, 9-12)
bucket = "2-5"
queries = ["Q1", "Q3"]
# pv-inproc-parsed: fresh parsed copy per call (no cache); pv-inproc-cached: one object, repeated calls (cache hits after the first)
variants = ["pv-inproc-parsed", "pv-inproc-cached", "pv-inproc-parse", "pv-dispatch", "lola", "tina"]
# safety cap per subprocess call, not a measurement
wall_cap_secs = 30
# calls of each startup baseline (`true`, `petrivet --version`)
baseline_reps = 200
# output file in [run] results_dir
file = "latency.jsonl"
# shuffle and choice seed; if absent [select] seed is used
# seed = 20261022

[e3]
# Campaign C / E3b: largest tolerated deadline overshoot in ms (H3b). Provisional, to be confirmed or changed by the
# pilot before any campaign runs; the analysis reports the distribution only if this key is absent.
overshoot_threshold_ms = 200
